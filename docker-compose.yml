services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docsync
      POSTGRES_PASSWORD: docsync
      POSTGRES_DB: docsync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsync"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://docsync:docsync@postgres:5432/docsync
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - snapshot_data:/app/data

  frontend:
    image: python:3.12-slim
    working_dir: /site
    volumes:
      - ./frontend:/site:ro
    command: python3 -m http.server 80
    ports:
      - "8080:80"

volumes:
  postgres_data:
  snapshot_data:
