name: CI/CD

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check app/ tests/ --select E9,F

      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v

  build-and-deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # "Open PR to main" has to read existing PRs and create one. Without this
    # block the default GITHUB_TOKEN is contents-only, and the step dies with
    # "Resource not accessible by integration (repository.pullRequests)".
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/docsync-backend:latest

      - name: Copy compose config and frontend to staging
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml,frontend/"
          target: "~/docsync"

      - name: Deploy to staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # ssh-action v1 has no script_stop input, so fail fast explicitly --
            # otherwise only the last command's exit code reaches the job.
            set -e
            cd ~/docsync
            export BACKEND_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/docsync-backend:latest"
            # Pull explicitly so compose never falls back to building from a
            # ./backend context that does not exist on this host.
            docker pull "$BACKEND_IMAGE"
            docker compose run --rm backend alembic upgrade head
            docker compose up -d

      - name: Open PR to main
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="Deploy: $(git log -1 --pretty=%s)"
          body="Opened automatically -- tests passed and this deployed cleanly to staging. Review and merge when ready."

          if out=$(gh pr create --base main --head dev --title "$title" --body "$body" 2>&1); then
            echo "$out"
          elif grep -qi "already exists" <<<"$out"; then
            echo "A PR from dev to main already exists -- nothing new to open."
          else
            echo "gh pr create failed:" >&2
            echo "$out" >&2
            exit 1
          fi

  notify-failure:
    needs: [test, build-and-deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Email on failure
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Docsync CI/CD failed on ${{ github.ref_name }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: Docsync CI
          body: |
            A workflow run failed for commit ${{ github.sha }}.
            Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
